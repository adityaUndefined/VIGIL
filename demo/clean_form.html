<!doctype html>
<meta charset="utf-8">
<title>Feedback form</title>
<h2>Feedback</h2>
<p>A perfectly ordinary page. Submitting this form should just work.</p>
<form id="leak" action="" method="get">
  <input name="email" value="student@example.edu">
  <input name="note" value="hello">
  <button type="submit">Submit form</button>
</form>
<pre id="formout"></pre>
<script>
if (location.search) {
  const params = new URLSearchParams(location.search);
  document.getElementById("formout").textContent =
    "Form submitted! Fields sent: " + [...params.keys()].join(", ");
}
</script>
