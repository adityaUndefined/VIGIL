name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Tests, coverage & static checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static checks (Python syntax + JavaScript syntax)
        run: |
          python3 -m compileall -q app.py vision_engine.py guard.py facts.py \
            explain.py guard_server.py test_fixtures.py detectors scripts
          for f in web/*.js extension/*.js vigil-extension/*.js guard-extension/*.js; do
            if [ -f "$f" ]; then node --check "$f"; fi
          done

      - name: Offline fixtures (message / HTML / action engine)
        run: python3 scripts/run_offline_fixtures.py

      - name: Vision fixtures
        run: python3 scripts/run_vision_tests.py

      - name: Agent-guard fixtures
        run: python3 test_fixtures.py

      - name: Coverage
        run: |
          python3 -m pip install --quiet coverage
          coverage run --parallel-mode scripts/run_offline_fixtures.py
          coverage run --parallel-mode scripts/run_vision_tests.py
          coverage run --parallel-mode test_fixtures.py
          coverage combine
          coverage report

      - name: Refresh coverage badge
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          PCT=$(coverage report | awk '/^TOTAL/{gsub(/%/,"",$NF); print int($NF)}')
          if [ -z "$PCT" ]; then echo "no coverage total"; exit 0; fi
          if   [ "$PCT" -ge 90 ]; then COLOR=brightgreen
          elif [ "$PCT" -ge 75 ]; then COLOR=green
          elif [ "$PCT" -ge 60 ]; then COLOR=yellowgreen
          else COLOR=yellow; fi
          mkdir -p badges
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$PCT" "$COLOR" > badges/coverage.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add badges/coverage.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: refresh coverage badge [skip ci]"
          git push
